<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>carBill — 통행료 대시보드</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#273449; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#818cf8;
    --good:#34d399; --warn:#fbbf24; --danger:#f87171;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif; padding:24px; line-height:1.5;}
  h1{font-size:22px; display:flex; align-items:center; gap:10px; margin-bottom:4px;}
  h1 .logo{color:var(--accent);}
  .sub{color:var(--muted); font-size:13px; margin-bottom:20px;}

  #drop{border:2px dashed var(--line); border-radius:14px; padding:32px 20px; text-align:center; color:var(--muted); cursor:pointer; transition:.2s; margin-bottom:22px;}
  #drop.over{border-color:var(--accent); background:var(--card2); color:var(--accent);}
  #drop input{display:none;}
  #drop .big{font-size:15px; margin-bottom:6px;}
  #drop .small{font-size:12px;}

  .tabs{display:none; gap:6px; margin-bottom:22px; border-bottom:1px solid var(--line);}
  .tabs button{background:transparent; border:1px solid transparent; border-bottom:none; color:var(--muted); padding:10px 18px; font-size:14px; cursor:pointer; border-radius:10px 10px 0 0; transition:.15s;}
  .tabs button.active{color:var(--accent); background:var(--card); border-color:var(--line); font-weight:600;}
  .tabs button:hover:not(.active){color:var(--text);}

  .tabpane{display:none;}
  .tabpane.active{display:block;}

  /* 카드 */
  #meta{display:none; flex-wrap:wrap; gap:10px; margin-bottom:24px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 18px; min-width:120px; flex:1 1 0;}
  .card .label{font-size:11px; color:var(--muted); margin-bottom:3px;}
  .card .value{font-size:22px; font-weight:700;}
  .card .value small{font-size:12px; color:var(--muted); font-weight:400;}
  .card .sub2{font-size:12px; color:var(--muted); margin-top:2px;}

  section{margin-bottom:28px;}
  section h2{font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  section h2::before{content:""; width:4px; height:16px; background:var(--accent); border-radius:2px;}
  .grid{display:grid; gap:14px;}
  .grid.cols2{grid-template-columns:1fr 1fr;}
  @media(max-width:900px){.grid.cols2{grid-template-columns:1fr;}}

  .panel{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px;}
  .panel h3{font-size:13px; color:var(--muted); margin-bottom:12px; font-weight:600;}

  /* 바차트 */
  .hbar{display:flex; align-items:center; gap:10px; margin-bottom:7px; font-size:12px;}
  .hbar .lbl{width:74px; color:var(--muted); text-align:right; flex:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hbar .track{flex:1; background:var(--card2); border-radius:6px; height:22px; position:relative; overflow:hidden;}
  .hbar .bar{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent2),var(--accent)); min-width:0; display:flex; align-items:center; transition:width .5s ease;}
  .hbar .val{width:86px; flex:none; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .hbar .val small{color:var(--muted); margin-left:5px;}
  .hbar.top1 .bar{background:linear-gradient(90deg,#f59e0b,#fbbf24);}
  .hbar:hover .bar{filter:brightness(1.15);}

  .tbl-wrap{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px;}
  table{border-collapse:collapse; width:100%; font-size:13px; min-width:560px;}
  th{background:var(--card2); text-align:left; padding:9px 12px; color:var(--muted); font-weight:600; white-space:nowrap;}
  td{padding:8px 12px; border-top:1px solid var(--line); white-space:nowrap;}
  tr:hover td{background:rgba(56,189,248,.06);}
  .num{text-align:right; font-variant-numeric:tabular-nums;}
  .tot td{background:var(--card2); font-weight:700; border-top:2px solid var(--accent);}

  .tag{display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; background:#0ea5e9; color:#fff;}
  .tag.trip{background:#8b5cf6;}
  .tag.est{background:#475569; color:var(--text);}
  .tag.unconf{background:#b45309; color:#fff;}
  .badge{display:inline-block; font-size:11px; padding:1px 8px; border-radius:6px; background:#334155; color:var(--muted);}

  /* 필터 바 */
  .fbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:12px;}
  .fbar input[type=text], .fbar select{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 10px; font-size:13px; outline:none;}
  .fbar input[type=text]{flex:1 1 180px; min-width:140px;}
  .fbar input[type=text]:focus, .fbar select:focus{border-color:var(--accent);}
  .fbar label{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; cursor:pointer;}
  .fbar .btn{background:var(--card2); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer;}
  .fbar .btn:hover{border-color:var(--accent); color:var(--accent);}
  .fcount{margin-left:auto; font-size:12px; color:var(--muted);}

  /* 상세 테이블: 여정 그룹 */
  .grp{background:rgba(129,140,248,.14); cursor:pointer;}
  .grp:hover td{background:rgba(129,140,248,.22);}
  .grp td{font-weight:600; border-top:2px solid var(--accent2);}
  .grp .chev{display:inline-block; transition:.15s; color:var(--muted); width:14px;}
  .grp.collapsed .chev{transform:rotate(-90deg);}
  .child.hidden{display:none;}
  .grp.unconf td{background:rgba(251,191,36,.16);}
  .grp.unconf:hover td{background:rgba(251,191,36,.26);}
  .row-unconf td{background:rgba(251,191,36,.05);}

  .recent td{white-space:normal;}
  .warnbox{background:#78350f; border:1px solid var(--warn); color:#fde68a; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:20px; display:none;}
  .foot{margin-top:8px; color:var(--muted); font-size:12px;}
</style>
</head>
<body>
  <h1><span class="logo">🚗</span> carBill 통행료 대시보드</h1>
  <div class="sub">정리된 통행료 CSV를 불러오면 대시보드·상세·요약을 제공합니다. 원본 하이패스 CSV도 열 수 있습니다.</div>

  <div class="warnbox" id="warn"></div>

  <div id="drop">
    <input type="file" id="file" accept=".csv,text/csv">
    <div class="big">여기에 CSV 파일을 끌어다 놓거나 <u>클릭해서 선택</u>하세요</div>
    <div class="small">예: data/private/results/2026-8-통행료-정리.csv 또는 data/sample/sample-result.csv</div>
  </div>

  <div id="meta"></div>

  <div class="tabs" id="tabs">
    <button data-tab="dash" class="active">대시보드</button>
    <button data-tab="detail">상세 내역</button>
    <button data-tab="summary">요약</button>
  </div>

  <!-- 대시보드 -->
  <div class="tabpane active" id="pane-dash">
    <section>
      <h2>주차별 통행료</h2>
      <div class="panel" id="week-chart"></div>
    </section>
    <div class="grid cols2">
      <section>
        <h2>일자별 통행료</h2>
        <div class="panel" id="day-chart"></div>
      </section>
      <section>
        <h2>경로별 상위 (여정)</h2>
        <div class="panel" id="route-chart"></div>
      </section>
    </div>
    <section>
      <h2>최근 여정</h2>
      <div class="tbl-wrap" id="recent-table"></div>
    </section>
    <section id="sec-tripcards" style="display:none">
      <h2>여행별 집계</h2>
      <div class="grid" id="tripcards"></div>
    </section>
  </div>

  <!-- 상세 내역 -->
  <div class="tabpane" id="pane-detail">
    <div class="fbar">
      <input type="text" id="f-search" placeholder="검색: 동선명 · 출발지 · 도착지 · 게이트 · 비고">
      <select id="f-route"><option value="">동선 전체</option></select>
      <select id="f-week"><option value="">주차 전체</option></select>
      <select id="f-trip"><option value="">여행 전체</option></select>
      <label><input type="checkbox" id="f-unconf"> 미확정만</label>
      <button class="btn" id="btn-expand">모두 접기</button>
      <button class="btn" id="btn-reset">초기화</button>
      <span class="fcount" id="f-count"></span>
    </div>
    <div class="tbl-wrap" id="detail-wrap"></div>
  </div>

  <!-- 요약 -->
  <div class="tabpane" id="pane-summary">
    <section>
      <h2>동선별 합계</h2>
      <div class="tbl-wrap" id="sum-route"></div>
    </section>
    <section>
      <h2>경로별 합계 (여정 단위)</h2>
      <div class="tbl-wrap" id="sum-jour"></div>
    </section>
    <div class="grid cols2">
      <section>
        <h2>주차별 합계</h2>
        <div class="tbl-wrap" id="sum-week"></div>
      </section>
      <section>
        <h2>일자별 합계</h2>
        <div class="tbl-wrap" id="sum-day"></div>
      </section>
    </div>
  </div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('ko-KR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================= CSV 파서 ================= */
function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const rows=[]; let row=[], cur='', inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){cur+='"'; i++;} else inQ=false; }
      else cur+=ch;
    }else{
      if(ch==='"') inQ=true;
      else if(ch===','){ row.push(cur); cur=''; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(ch==='\r'){ }
      else cur+=ch;
    }
  }
  if(cur!=='' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

/* ================= 헤더/유형 탐지 ================= */
function detect(rows){
  const isResult = r => r.includes('추정출발지') && r.includes('몇월몇주차') && r.includes('여정ID');
  const isRaw    = r => r[0]?.trim()==='번호' && r.includes('거래일시') && r.includes('청구금액');
  for(const r of rows){ if(isResult(r)) return {type:'result', header:r, idx:rows.indexOf(r)}; }
  for(const r of rows){ if(isRaw(r))    return {type:'raw',    header:r, idx:rows.indexOf(r)}; }
  return {type:'generic', header:rows[0], idx:0};
}
const colIdx = (header, names) => {
  for(const n of names){ const i=header.findIndex(h=>String(h).trim()===n); if(i>=0) return i; }
  return -1;
};

/* ================= 결과 데이터 모델 ================= */
let STATE = { groups:[], filtered:[], sortKey:'date', sortDir:1, collapsed:false, total:0 };

function buildResultModel(header, data){
  const ci = {
    week:colIdx(header,['몇월몇주차']), date:colIdx(header,['일자']), time:colIdx(header,['거래시각']),
    jid:colIdx(header,['여정ID']), tid:colIdx(header,['여행ID']), name:colIdx(header,['동선명']),
    src:colIdx(header,['추정출발지']), dst:colIdx(header,['추정도착지']),
    entry:colIdx(header,['입구']), exit:colIdx(header,['출구']),
    amt:colIdx(header,['통행료']), no:colIdx(header,['원본번호']), etc:colIdx(header,['비고']),
  };
  const tx = data.map(r=>({
    week:r[ci.week]||'', date:r[ci.date]||'', time:r[ci.time]||'',
    jid:r[ci.jid]||'', tid:r[ci.tid]||'', name:r[ci.name]||'', src:r[ci.src]||'', dst:r[ci.dst]||'',
    entry:r[ci.entry]||'', exit:r[ci.exit]||'', amt:Number(r[ci.amt])||0, no:r[ci.no]||'', etc:r[ci.etc]||'',
  })).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));

  // 여정 그룹핑 (순서 유지)
  const gmap=new Map();
  for(const t of tx){
    const key=t.jid||'(미분류)';
    if(!gmap.has(key)) gmap.set(key,{jid:key, rows:[], first:t.date, name:t.name, src:t.src, dst:t.dst, tid:t.tid});
    const g=gmap.get(key); g.rows.push(t);
    if(t.date<g.first) g.first=t.date;
  }
  const groups=[...gmap.values()].map(g=>{
    g.sum=g.rows.reduce((a,t)=>a+t.amt,0); g.n=g.rows.length;
    g.unconf = (g.name==='미확정') || (!g.name && !g.src);
    return g;
  }).sort((a,b)=>a.first.localeCompare(b.first));

  const total = tx.reduce((a,t)=>a+t.amt,0);
  STATE = { groups, filtered:[...groups], sortKey:'date', sortDir:1, collapsed:false, total };
  return { tx, groups, total };
}

/* ================= 바차트 ================= */
function hbar(container, items, {max}){
  const m = max ?? Math.max(...items.map(i=>i.value), 1);
  container.innerHTML = items.map((it,i)=>
    `<div class="hbar ${it.top?'top1':''}" title="${esc(it.label)} — ${fmt(it.value)}원${it.sub?` (${esc(it.sub)})`:''}">
       <div class="lbl">${esc(it.label)}</div>
       <div class="track"><div class="bar" style="width:${(it.value/m*100).toFixed(1)}%"></div></div>
       <div class="val">${fmt(it.value)}<small>${esc(it.sub||'')}</small></div>
     </div>`).join('');
}

/* ================= 대시보드 ================= */
function renderDashboard(header, data, model){
  const total=model.total;
  const trips=new Set(data.map(r=>r[3])).size; // 여행ID
  const avg=data.length? Math.round(total/data.length):0;
  // 최다 지출 동선
  const nm=new Map();
  for(const r of data){ const k=r[5]||'(미분류)'; nm.set(k,(nm.get(k)||0)+Number(r[10]||0)); }
  const topRoute=[...nm.entries()].sort((a,b)=>b[1]-a[1])[0];

  $('meta').innerHTML =
    `<div class="card"><div class="label">파일</div><div class="value" style="font-size:15px;font-weight:600"><small>${esc(fileName())}</small></div></div>`+
    `<div class="card"><div class="label">통행료 합계</div><div class="value">${fmt(total)}<small>원</small></div></div>`+
    `<div class="card"><div class="label">거래 수</div><div class="value">${data.length}<small>건</small></div></div>`+
    `<div class="card"><div class="label">여정 수</div><div class="value">${model.groups.length}<small>개</small></div></div>`+
    (trips?`<div class="card"><div class="label">여행 수</div><div class="value">${trips}<small>개</small></div></div>`:'')+
    `<div class="card"><div class="label">건당 평균</div><div class="value">${fmt(avg)}<small>원</small></div></div>`+
    `<div class="card"><div class="label">최다 지출 동선</div><div class="value" style="font-size:15px;font-weight:600">${esc(topRoute?.[0]||'-')}</div><div class="sub2">${fmt(topRoute?.[1]||0)}원</div></div>`;

  // 여행 카드
  const tmap=new Map();
  for(const r of data){ const t=r[3]; if(!t) continue; const o=tmap.get(t)||{sum:0,n:0,name:r[5]||''}; o.sum+=Number(r[10]||0); o.n++; tmap.set(t,o); }
  if(tmap.size){
    $('sec-tripcards').style.display='';
    $('tripcards').innerHTML=[...tmap.entries()].map(([t,o])=>
      `<div class="card"><div class="label"><span class="tag trip">${esc(t)}</span> · ${esc(o.name)}</div><div class="value">${fmt(o.sum)}<small>원</small></div><div class="sub2">${o.n}건</div></div>`).join('');
  }

  // 주차별
  const wm=new Map();
  for(const r of data){ const k=r[0]||''; const o=wm.get(k)||{sum:0,n:0}; o.sum+=Number(r[10]||0); o.n++; wm.set(k,o); }
  const wlist=[...wm.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko')).map(([k,o])=>({label:k, value:o.sum, sub:`${o.n}건`}));
  hbar($('week-chart'), wlist, {max:Math.max(...wlist.map(i=>i.value),1)});

  // 일자별
  const dm=new Map();
  for(const r of data){ const k=r[1]||''; const o=dm.get(k)||{sum:0,n:0}; o.sum+=Number(r[10]||0); o.n++; dm.set(k,o); }
  const dlist=[...dm.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,o])=>({label:k.slice(5), value:o.sum, sub:`${o.n}건`}));
  hbar($('day-chart'), dlist, {max:Math.max(...dlist.map(i=>i.value),1)});

  // 경로별 상위 N (여정)
  const glist=model.groups.map(g=>({label:`${g.jid} ${g.name}`, value:g.sum, sub:`${g.n}건`, top:false}))
    .sort((a,b)=>b.value-a.value);
  const topN=glist.slice(0,8);
  const rest=glist.slice(8).reduce((a,g)=>a+g.value,0);
  if(rest>0) topN.push({label:'기타', value:rest, sub:`${glist.length-8}여정`});
  topN.forEach((g,i)=>{ if(i===0) g.top=true; });
  hbar($('route-chart'), topN, {max:topN[0]?.value||1});

  // 최근 여정
  const recent=model.groups.slice().reverse().slice(0,8);
  renderTable($('recent-table'),
    ['일자','여정','동선명','경로(추정)','거래수','통행료'],
    recent.map(g=>[g.first, `<span class="badge">${esc(g.jid)}</span>`+(g.tid?` <span class="tag trip">${esc(g.tid)}</span>`:''), g.name,
      `${esc(g.src||'?')} → ${esc(g.dst||'?')}`, String(g.n), fmt(g.sum)]),
    {numCols:[5]});
}

/* ================= 상세 내역 ================= */
let sortMeta={}; // column index → {key, dir} in header terms

function renderDetail(){
  const q=$('f-search').value.trim().toLowerCase();
  const fr=$('f-route').value, fw=$('f-week').value, ft=$('f-trip').value, fu=$('f-unconf').checked;

  // 트랜잭션 필터
  const groups=[];
  for(const g of STATE.groups){
    let rows=g.rows.filter(t=>{
      if(fr && t.name!==fr) return false;
      if(fw && t.week!==fw) return false;
      if(ft && t.tid!==ft) return false;
      if(fu && !g.unconf) return false;
      if(q){
        const blob=(t.name+' '+t.src+' '+t.dst+' '+t.entry+' '+t.exit+' '+t.etc).toLowerCase();
        if(!blob.includes(q)) return false;
      }
      return true;
    });
    if(rows.length) groups.push({...g, rows});
  }

  // 그룹 정렬
  const sKey=STATE.sortKey, sDir=STATE.sortDir;
  const sortVal = g => sKey==='amt'?g.sum : sKey==='jid'?g.jid : g.first;
  groups.sort((a,b)=>{ const x=sortVal(a),y=sortVal(b); return (x<y?-1:x>y?1:0)*sDir; });

  const shown=groups.reduce((a,g)=>a+g.rows.length,0);
  const total=STATE.groups.reduce((a,g)=>a+g.rows.length,0);
  $('f-count').textContent = `표시 ${shown}건 / 전체 ${total}건`;

  const colNames=['몇월몇주차','일자','거래시각','여정ID','여행ID','동선명','추정출발지','추정도착지','입구','출구','통행료','원본번호','비고'];

  let html=`<table><thead><tr>${colNames.map((n,i)=>`<th class="sortable" data-i="${i}">${esc(n)}${sortMeta[i]?` ${sortMeta[i].dir>0?'▲':'▼'}`:''}</th>`).join('')}</tr></thead><tbody>`;
  for(const g of groups){
    const rows=g.rows.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    const gsum=rows.reduce((a,t)=>a+t.amt,0);
    html+=`<tr class="grp${STATE.collapsed?' collapsed':''}${g.unconf?' unconf':''}" data-gid="${esc(g.jid)}">
      <td colspan="4"><span class="chev">▼</span> <span class="badge">${esc(g.jid)}</span>${g.tid?` <span class="tag trip">${esc(g.tid)}</span>`:''}</td>
      <td></td><td><b>${esc(g.name)}</b>${g.unconf?' <span class="tag unconf">미확정</span>':''}</td>
      <td>${esc(g.src||'?')}</td><td>${esc(g.dst||'?')}</td><td colspan="2"></td>
      <td class="num"><b>${fmt(gsum)}</b></td><td></td><td class="num">${rows.length}건</td></tr>`;
    for(const t of rows){
      html+=`<tr class="child${STATE.collapsed?' hidden':''}${g.unconf?' row-unconf':''}">
        <td>${esc(t.week)}</td><td>${esc(t.date)}</td><td>${esc(t.time)}</td><td>${esc(t.jid)}</td><td>${esc(t.tid)}</td>
        <td>${esc(t.name)}</td><td>${esc(t.src)}</td><td>${esc(t.dst)}</td><td>${esc(t.entry)}</td><td>${esc(t.exit)}</td>
        <td class="num">${fmt(t.amt)}</td><td>${esc(t.no)}</td><td>${esc(t.etc)}</td></tr>`;
    }
  }
  html+='</tbody></table>';
  if(!groups.length) html='<div style="padding:30px;text-align:center;color:var(--muted)">조건에 맞는 내역이 없습니다.</div>';
  $('detail-wrap').innerHTML=html;

  // 그룹 토글
  $('detail-wrap').querySelectorAll('tr.grp').forEach(tr=>{
    tr.addEventListener('click',()=>{
      tr.classList.toggle('collapsed');
      let el=tr.nextElementSibling;
      while(el && !el.classList.contains('grp')){
        el.classList.toggle('hidden', tr.classList.contains('collapsed'));
        el=el.nextElementSibling;
      }
    });
  });
  // 정렬
  $('detail-wrap').querySelectorAll('th.sortable').forEach(th=>{
    th.addEventListener('click',()=>{
      const i=Number(th.dataset.i);
      const key = i===10?'amt' : i===3?'jid' : 'date';
      if(STATE.sortKey===key) STATE.sortDir*=-1; else { STATE.sortKey=key; STATE.sortDir=1; }
      sortMeta={}; sortMeta[i]={key,dir:STATE.sortDir};
      renderDetail();
    });
  });
}

/* ================= 요약 ================= */
function renderSummary(header, data, model){
  const amt=r=>Number(r[10]||0);

  // 동선별
  const rmap=new Map();
  for(const r of data){ const k=r[5]||'(미분류)'; const o=rmap.get(k)||{sum:0,n:0,j:new Set(),un:false}; o.sum+=amt(r); o.n++; o.j.add(r[3]); o.un=o.un||r[5]==='미확정'; rmap.set(k,o); }
  renderTable($('sum-route'),
    ['동선명','여정 수','거래 수','통행료'],
    [...rmap.entries()].sort((a,b)=>b[1].sum-a[1].sum).map(([k,o])=>[
      k+(o.un?' <span class="tag unconf">미확정</span>':''), String(o.j.size), String(o.n), fmt(o.sum)]),
    {numCols:[3]});
  addTot($('sum-route'), ['<td>합계</td>', `<td>${model.groups.length}</td>`, `<td>${data.length}</td>`, `<td class="num">${fmt(model.total)}</td>`]);

  // 경로별(여정)
  renderTable($('sum-jour'),
    ['일자','여정','여행','동선명','추정출발지→추정도착지','거래수','통행료'],
    model.groups.map(g=>[
      g.first, `<span class="badge">${esc(g.jid)}</span>`, g.tid?`<span class="tag trip">${esc(g.tid)}</span>`:'', g.name,
      `${esc(g.src)} → ${esc(g.dst)}`, String(g.n), fmt(g.sum)]),
    {numCols:[6]});
  addTot($('sum-jour'), ['<td>합계</td>','<td></td>','<td></td>','<td></td>','<td></td>', `<td>${data.length}</td>`, `<td class="num">${fmt(model.total)}</td>`]);

  // 주차별
  const wm=new Map();
  for(const r of data){ const k=r[0]||''; const o=wm.get(k)||{sum:0,n:0}; o.sum+=amt(r); o.n++; wm.set(k,o); }
  renderTable($('sum-week'),['몇월몇주차','거래 수','통행료'],
    [...wm.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko')).map(([k,o])=>[k,String(o.n),fmt(o.sum)]),
    {numCols:[2]});
  addTot($('sum-week'), ['<td>합계</td>', `<td>${data.length}</td>`, `<td class="num">${fmt(model.total)}</td>`]);

  // 일자별
  const dm=new Map();
  for(const r of data){ const k=r[1]||''; const o=dm.get(k)||{sum:0,n:0,w:''}; o.sum+=amt(r); o.n++; o.w=r[0]||''; dm.set(k,o); }
  renderTable($('sum-day'),['일자','몇월몇주차','거래 수','통행료'],
    [...dm.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,o])=>[k,o.w,String(o.n),fmt(o.sum)]),
    {numCols:[3]});
  addTot($('sum-day'), ['<td>합계</td>','<td></td>', `<td>${data.length}</td>`, `<td class="num">${fmt(model.total)}</td>`]);
}

function addTot(container, cells){
  container.querySelector('table').insertAdjacentHTML('beforeend', `<tr class="tot">${cells.join('')}</tr>`);
}

function renderTable(container, headers, rows, opts={}){
  const head=`<tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr>`;
  const body=rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${opts.numCols?.includes(i)?'num':''}">${c}</td>`).join('')}</tr>`).join('');
  container.innerHTML=`<table>${head}${body}</table>`;
}

/* ================= 원본/일반 ================= */
function renderRaw(header, data, fileName){
  const di=colIdx(header,['거래일시']), ai=colIdx(header,['청구금액']);
  const total=data.reduce((a,r)=>a+(Number((r[ai]||'').replace(/,/g,''))||0),0);
  const dm=new Map();
  for(const r of data){ const d=(r[di]||'').slice(0,10); const o=dm.get(d)||{sum:0,n:0}; o.sum+=Number((r[ai]||'').replace(/,/g,''))||0; o.n++; dm.set(d,o); }
  renderTable($('sum-day'),['일자','거래 수','통행료(청구금액)'],
    [...dm.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,o])=>[k,String(o.n),fmt(o.sum)]), {numCols:[2]});
  addTot($('sum-day'), ['<td>합계</td>', `<td>${data.length}</td>`, `<td class="num">${fmt(total)}</td>`]);
  $('meta').innerHTML=
    `<div class="card"><div class="label">파일</div><div class="value" style="font-size:15px"><small>${esc(fileName)}</small></div></div>`+
    `<div class="card"><div class="label">거래 수</div><div class="value">${data.length}<small>건</small></div></div>`+
    `<div class="card"><div class="label">통행료 합계</div><div class="value">${fmt(total)}<small>원</small></div></div>`+
    `<div class="card"><div class="label">유형</div><div class="value"><small>원본 하이패스 CSV</small></div></div>`;
  $('detail-wrap').innerHTML=`<table><thead><tr>${header.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${data.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  activateTabs(false);
}
function renderGeneric(header, data, fileName){
  $('meta').innerHTML=
    `<div class="card"><div class="label">파일</div><div class="value" style="font-size:15px"><small>${esc(fileName)}</small></div></div>`+
    `<div class="card"><div class="label">컬럼 수</div><div class="value">${header.length}</div></div>`+
    `<div class="card"><div class="label">행 수</div><div class="value">${data.length}</div></div>`;
  $('detail-wrap').innerHTML=`<table><thead><tr>${header.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${data.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  activateTabs(false);
}

/* ================= 탭 ================= */
let currentFile='';
function fileName(){ return currentFile; }
function activateTabs(show){
  $('tabs').style.display=show?'flex':'none';
  document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
  if(show){
    document.querySelector('.tabs button').click();
    $('pane-dash').classList.add('active');
  }else{
    $('pane-detail').classList.add('active');
    document.querySelector('.tabs button[data-tab="detail"]').classList.add('active');
  }
}
document.querySelectorAll('.tabs button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tabpane').forEach(p=>p.classList.remove('active'));
    b.classList.add('active');
    $('pane-'+b.dataset.tab).classList.add('active');
  });
});

/* ================= 로드 ================= */
function loadFile(file){
  currentFile=file.name;
  const reader=new FileReader();
  reader.onload=e=>{
    const rows=parseCSV(e.target.result);
    if(!rows.length){ $('warn').textContent='빈 CSV 파일입니다.'; $('warn').style.display=''; return; }
    $('warn').style.display='none';
    try{
      const d=detect(rows);
      const header=d.header, data=rows.slice(d.idx+1).filter(r=>r.some(c=>String(c).trim()!==''));
      $('meta').style.display='flex';
      if(d.type==='result'){
        const model=buildResultModel(header,data);
        // 필터 옵션 채우기
        const routes=new Set(model.groups.map(g=>g.name));
        const weeks=new Set(data.map(r=>r[0]));
        const trips=new Set(model.groups.filter(g=>g.tid).map(g=>g.tid));
        fillSelect($('f-route'),routes); fillSelect($('f-week'),weeks); fillSelect($('f-trip'),trips);
        renderDashboard(header,data,model);
        renderDetail();
        renderSummary(header,data,model);
        activateTabs(true);
      }else if(d.type==='raw') renderRaw(header,data,file.name);
      else renderGeneric(header,data,file.name);
    }catch(err){ $('warn').textContent='파싱 중 오류: '+err.message; $('warn').style.display=''; }
  };
  reader.readAsText(file);
}
function fillSelect(sel,set){
  const cur=sel.value; sel.innerHTML='';
  const first=sel=== $('f-route')?'동선 전체':sel===$('f-week')?'주차 전체':'여행 전체';
  sel.add(new Option(first,''));
  [...set].sort((a,b)=>a.localeCompare(b,'ko')).forEach(v=>sel.add(new Option(v,v)));
  sel.value=cur;
}

/* 필터 이벤트 */
$('f-search').addEventListener('input',renderDetail);
$('f-route').addEventListener('change',renderDetail);
$('f-week').addEventListener('change',renderDetail);
$('f-trip').addEventListener('change',renderDetail);
$('f-unconf').addEventListener('change',renderDetail);
$('btn-reset').addEventListener('click',()=>{ $('f-search').value=''; $('f-route').value=''; $('f-week').value=''; $('f-trip').value=''; $('f-unconf').checked=false; renderDetail(); });
$('btn-expand').addEventListener('click',()=>{ STATE.collapsed=!STATE.collapsed; $('btn-expand').textContent=STATE.collapsed?'모두 펼치기':'모두 접기'; renderDetail(); });

/* 드롭존 */
const drop=$('drop');
drop.addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{ if(e.target.files[0]) loadFile(e.target.files[0]); });
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) loadFile(f); });

/* ================= 샘플 자동 로드 (GitHub Pages 데모) ================= */
(function(){
  const params=new URLSearchParams(location.search);
  const sample=params.get('load')||params.get('sample');
  if(!sample) return;
  const map={'result':'data/sample/sample-result.csv','toll':'data/sample/sample-toll.csv','route':'data/sample/sample-route.csv','result.csv':'data/sample/sample-result.csv'};
  const url=map[sample]||(sample.endsWith('.csv')?sample:'data/sample/sample-'+sample+'.csv');
  $('drop').innerHTML='<div class="big">샘플 데이터 로딩 중…</div>';
  fetch(url).then(r=>{
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(text=>{
    loadFromText(text, url.split('/').pop());
  }).catch(err=>{
    $('warn').textContent='샘플 로드 실패: '+err.message+' — 파일을 직접 끌어다 놓으세요.';
    $('warn').style.display='';
    $('drop').innerHTML='<div class="big">여기에 CSV 파일을 끌어다 놓거나 <u>클릭해서 선택</u>하세요</div><div class="small">샘플 자동 로드에 실패했습니다.</div>';
  });
})();
function loadFromText(text, name){
  const rows=parseCSV(text);
  if(!rows.length){ $('warn').textContent='빈 CSV 파일입니다.'; $('warn').style.display=''; return; }
  $('warn').style.display='none';
  const d=detect(rows);
  const header=d.header, data=rows.slice(d.idx+1).filter(r=>r.some(c=>String(c).trim()!==''));
  $('meta').style.display='flex';
  if(d.type==='result'){
    const model=buildResultModel(header,data);
    const routes=new Set(model.groups.map(g=>g.name));
    const weeks=new Set(data.map(r=>r[0]));
    const trips=new Set(model.groups.filter(g=>g.tid).map(g=>g.tid));
    fillSelect($('f-route'),routes); fillSelect($('f-week'),weeks); fillSelect($('f-trip'),trips);
    renderDashboard(header,data,model);
    renderDetail();
    renderSummary(header,data,model);
    activateTabs(true);
  }else if(d.type==='raw') renderRaw(header,data,name);
  else renderGeneric(header,data,name);
}
